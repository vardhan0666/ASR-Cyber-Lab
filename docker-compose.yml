version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: asr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - asr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asr_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asr_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # NET_RAW/NET_ADMIN are required for Nmap SYN scans and OS detection.
    # The container does NOT run as root; capabilities are applied narrowly
    # to the nmap binary via setcap in the Dockerfile.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      - asr_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asr_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - asr_network

networks:
  asr_network:
    driver: bridge

volumes:
  asr_postgres_data: